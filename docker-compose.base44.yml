services:
  web:
    image: python:3.12-slim
    working_dir: /site
    command: ["python", "-m", "http.server", "80", "--bind", "0.0.0.0"]
    ports:
      - "3000:80"
    volumes:
      - ./:/site:ro
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/index.html')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
